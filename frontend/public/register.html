<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - School SMS Broadcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl">
        <div class="text-center">
            <h2 class="text-3xl font-bold text-gray-900">Create Account</h2>
            <p class="mt-2 text-sm text-gray-600">Register as a teacher or staff member</p>
        </div>

        <div id="message" class="mt-4 hidden"></div>

        <form class="mt-8 space-y-6" id="registerForm">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="you@school.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Min 6 characters">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                    <input type="password" id="confirmPassword" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Confirm your password">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 px-4 rounded-lg hover:from-blue-700 hover:to-purple-700 font-semibold transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? 
                <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline">Sign In</a>
            </p>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-200">
            <p class="text-center text-xs text-gray-500">SCHOOL MANAGEMENT SYSTEM</p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Clear previous messages
            messageDiv.classList.add('hidden');
            messageDiv.textContent = '';

            // Validation
            if (!name || !email || !password) {
                messageDiv.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded';
                messageDiv.textContent = 'Please fill in all fields';
                messageDiv.classList.remove('hidden');
                return;
            }

            if (password !== confirmPassword) {
                messageDiv.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded';
                messageDiv.textContent = 'Passwords do not match!';
                messageDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                messageDiv.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded';
                messageDiv.textContent = 'Password must be at least 6 characters';
                messageDiv.classList.remove('hidden');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                const response = await fetch('https://school-sms-backend.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name, 
                        email, 
                        password, 
                        role: 'teacher' 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.className = 'mt-4 bg-green-50 border-l-4 border-green-500 p-4 rounded';
                    messageDiv.textContent = '✅ Account created successfully! Redirecting to login...';
                    messageDiv.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageDiv.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded';
                    messageDiv.textContent = data.message || 'Registration failed. Please try again.';
                    messageDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (error) {
                messageDiv.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded';
                messageDiv.textContent = 'Registration failed. Please try again.';
                messageDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
