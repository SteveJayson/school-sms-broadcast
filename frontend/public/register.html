<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - School SMS Broadcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <!-- Header -->
        <div class="text-center">
            <h2 class="text-3xl font-bold text-gray-900">Create Account</h2>
            <p class="mt-2 text-sm text-gray-600">Register as a teacher or staff member</p>
        </div>

        <!-- Message Area -->
        <div id="message" class="mt-4 hidden"></div>

        <!-- Register Form -->
        <form id="registerForm" class="mt-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="you@school.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Min 6 characters">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirmPassword" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Confirm your password">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 px-4 rounded-lg hover:from-blue-700 hover:to-purple-700 font-semibold transition">
                Create Account
            </button>
        </form>

        <!-- Login Link -->
        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? 
                <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline">Sign In</a>
            </p>
        </div>

        <!-- Footer -->
        <div class="mt-4 pt-4 border-t border-gray-200">
            <p class="text-center text-xs text-gray-500">SCHOOL MANAGEMENT SYSTEM</p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            // Reset message
            message.classList.add('hidden');
            message.textContent = '';

            // Validation
            if (!name || !email || !password || !confirm) {
                message.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-3 rounded text-red-700 text-sm';
                message.textContent = 'Please fill in all fields';
                message.classList.remove('hidden');
                return;
            }

            if (password !== confirm) {
                message.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-3 rounded text-red-700 text-sm';
                message.textContent = 'Passwords do not match!';
                message.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                message.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-3 rounded text-red-700 text-sm';
                message.textContent = 'Password must be at least 6 characters';
                message.classList.remove('hidden');
                return;
            }

            // Disable button
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const response = await fetch('https://school-sms-backend.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role: 'teacher' })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = 'mt-4 bg-green-50 border-l-4 border-green-500 p-3 rounded text-green-700 text-sm';
                    message.textContent = '✅ Account created successfully! Redirecting to login...';
                    message.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    message.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-3 rounded text-red-700 text-sm';
                    message.textContent = data.message || 'Registration failed. Please try again.';
                    message.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            } catch (error) {
                message.className = 'mt-4 bg-red-50 border-l-4 border-red-500 p-3 rounded text-red-700 text-sm';
                message.textContent = 'Registration failed. Please try again.';
                message.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
